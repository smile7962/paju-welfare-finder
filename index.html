<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>파주 복지 찾기</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="header">
    <h1>파주 복지 찾기</h1>
    <p>파주 시민을 위한 복지 정보를 한눈에</p>
  </header>

  <main class="container">
    <!-- 조건 입력 영역 -->
    <section class="filter-box">
      <div class="filter-row">
        <label class="filter-item">
          나이
          <input type="number" id="filter-age" min="0" max="120" placeholder="예: 30" />
        </label>
        <label class="filter-item">
          대상 구분
          <select id="filter-category">
            <option value="전체">전체</option>
            <option value="청년">청년</option>
            <option value="노인">노인</option>
            <option value="아동·청소년">아동·청소년</option>
            <option value="장애인">장애인</option>
            <option value="임산부·출산">임산부·출산</option>
            <option value="저소득">저소득</option>
          </select>
        </label>
      </div>

      <div class="filter-row">
        <label class="filter-item">
          가구원 수
          <select id="filter-household">
            <option value="">선택 안 함</option>
            <option value="1">1인</option>
            <option value="2">2인</option>
            <option value="3">3인</option>
            <option value="4">4인</option>
            <option value="5">5인</option>
            <option value="6">6인</option>
            <option value="7">7인</option>
          </select>
        </label>
        <label class="filter-item">
          월 소득 (만원)
          <input type="number" id="filter-income" min="0" placeholder="예: 250" />
        </label>
      </div>

      <fieldset class="qual-group">
        <legend>해당되는 자격 (선택하면 관련 복지가 더 나타나요)</legend>
        <label><input type="checkbox" class="qual-check" value="기초생활수급자" /> 기초생활수급자</label>
        <label><input type="checkbox" class="qual-check" value="차상위계층" /> 차상위계층</label>
        <label><input type="checkbox" class="qual-check" value="한부모가정" /> 한부모가정</label>
        <label><input type="checkbox" class="qual-check" value="다자녀가정" /> 다자녀가정</label>
        <label><input type="checkbox" class="qual-check" value="등록장애인" /> 등록장애인</label>
        <label><input type="checkbox" class="qual-check" value="국가유공자" /> 국가유공자</label>
        <label><input type="checkbox" class="qual-check" value="다문화가정" /> 다문화가정</label>
      </fieldset>
    </section>

    <!-- 소득 수준 안내 -->
    <p id="income-info" class="income-info"></p>

    <!-- 검색 결과 개수 안내 -->
    <p id="result-count" class="result-count"></p>

    <!-- 복지 목록이 여기에 자동으로 채워집니다 -->
    <section id="welfare-list" class="welfare-list"></section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>

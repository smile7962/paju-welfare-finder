<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>파주 복지 찾기</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="header">
    <h1>파주 복지 찾기</h1>
    <p>파주 시민을 위한 복지 정보를 한눈에</p>
  </header>

  <main class="container">
    <!-- 조건 입력 영역 -->
    <section class="filter-box">
      <label class="filter-item">
        나이
        <input type="number" id="filter-age" min="0" max="120" placeholder="예: 30" />
      </label>
      <label class="filter-item">
        대상 구분
        <select id="filter-category">
          <option value="전체">전체</option>
          <option value="청년">청년</option>
          <option value="노인">노인</option>
          <option value="아동·청소년">아동·청소년</option>
          <option value="장애인">장애인</option>
          <option value="임산부·출산">임산부·출산</option>
          <option value="저소득">저소득</option>
        </select>
      </label>
    </section>

    <!-- 검색 결과 개수 안내 -->
    <p id="result-count" class="result-count"></p>

    <!-- 복지 목록이 여기에 자동으로 채워집니다 -->
    <section id="welfare-list" class="welfare-list"></section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
